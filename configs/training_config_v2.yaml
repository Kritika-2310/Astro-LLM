run_name: "astro-llm-aud-r16-lr2e4-e2"

model:
  # Same base model id your v1 run actually used (v1 config says Llama-3, README says 3.1: decide, then keep ONE everywhere).
  base_model_id: "meta-llama/Meta-Llama-3-8B-Instruct"
  load_in_4bit: true
  max_seq_length: 512

data:
  train_path: "data/processed_v2/train.jsonl"
  val_path: "data/processed_v2/val.jsonl"
  prompt_template: "prompts/audience_style_template.txt"
  styles_path: "prompts/audience_styles.yaml"

training:
  learning_rate: 2.0e-4
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  weight_decay: 0.0
  logging_steps: 5
  eval_strategy: "steps"
  eval_steps: 25
  save_strategy: "steps"
  save_steps: 25
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  early_stopping_patience: 3
  seed: 42

output:
  output_dir: "outputs/${run_name}"
  adapter_dir: "outputs/${run_name}/final_adapter"

tracking:
  report_to: "wandb"
  wandb_project: "astro-llm"
